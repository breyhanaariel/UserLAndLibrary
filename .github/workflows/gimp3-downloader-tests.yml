name: Verify isolated GIMP 3 downloader regression tests

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - .github/workflows/gimp3-downloader-tests.yml

permissions:
  contents: read

jobs:
  downloader-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out migration branch and nested libraries
        uses: actions/checkout@v5
        with:
          ref: feature/gimp3-isolated-rootfs
          submodules: recursive
          persist-credentials: false
      - name: Record exact tested revision
        run: |
          git rev-parse HEAD
          git submodule status --recursive
      - name: Configure Java 17 for Android SDK tools
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android 30 platform and build tools
        run: |
          sdkmanager "platforms;android-30" "build-tools;30.0.3"
      - name: Switch to Java 11 for legacy Gradle 6.5
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
      - name: Verify checkout and Gradle prerequisites
        run: |
          git rev-parse HEAD
          java -version
          grep -n -E 'apply plugin:|compileSdkVersion|kotlin_version|android_plugin' app/build.gradle build.gradle
          test -f ./gradlew
          # Fail with a targeted diagnostic before Gradle configuration if removed
          # rootProject version properties are referenced in the module.
          if grep -nE 'rootProject\\.ext\\.(appVersionCode|appVersionName)' app/build.gradle; then
            echo "ERROR: Android module references undefined rootProject version properties"
            exit 1
          fi
      - name: Verify Android Gradle configuration first
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew :app:help --no-daemon --console=plain 2>&1 | tee gradle-config.log
      - name: Execute AssetDownloader regression tests
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --tests 'tech.ula.utils.AssetDownloaderTest' --no-daemon --console=plain 2>&1 | tee gradle-tests.log
