name: Verify isolated GIMP 3 downloader regression tests

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - .github/workflows/gimp3-downloader-tests.yml

permissions:
  contents: read

jobs:
  downloader-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out migration branch and nested libraries
        uses: actions/checkout@v5
        with:
          ref: feature/gimp3-isolated-rootfs
          submodules: recursive
          persist-credentials: false
      - name: Record exact tested revision
        run: |
          git rev-parse HEAD
          git submodule status --recursive
      - name: Configure Java 17 for Android SDK tools
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android 30 platform and build tools
        run: |
          sdkmanager "platforms;android-30" "build-tools;30.0.3"
      - name: Switch to Java 11 for legacy Gradle 6.5
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
      - name: Verify checkout and Gradle prerequisites
        run: |
          git rev-parse HEAD
          java -version
          grep -n -E 'apply plugin:|compileSdkVersion|kotlin_version|android_plugin' app/build.gradle build.gradle
          test -f ./gradlew
          # Fail with a targeted diagnostic before Gradle configuration if removed
          # rootProject version properties are referenced in the module.
          if grep -nE 'rootProject\\.ext\\.(appVersionCode|appVersionName)' app/build.gradle; then
            echo "ERROR: Android module references undefined rootProject version properties"
            exit 1
          fi
      - name: Restore pinned upstream FreeRDP Android source for CI
        run: |
          set -euo pipefail
          FREERDP_SHA=c0020308ebd33cefbd4548f03697f0c186a3631b
          FREERDP_PARENT=remote-desktop-clients/remoteClientLib/jni/libs/deps
          mkdir -p "$FREERDP_PARENT"
          git clone --filter=blob:none --no-checkout https://github.com/FreeRDP/FreeRDP.git "$FREERDP_PARENT/FreeRDP"
          git -C "$FREERDP_PARENT/FreeRDP" fetch --depth=1 origin "$FREERDP_SHA"
          git -C "$FREERDP_PARENT/FreeRDP" checkout --detach FETCH_HEAD
          test "$(git -C "$FREERDP_PARENT/FreeRDP" rev-parse HEAD)" = "$FREERDP_SHA"
          test -f "$FREERDP_PARENT/FreeRDP/client/Android/Studio/freeRDPCore/build.gradle"
          # The upstream Android library requires root ext properties not
          # defined in UserLAndLibrary. Supply them only in this CI checkout.
          cat >> build.gradle <<'GRADLE'

          ext {
              compileApi = 30
              toolsVersion = '30.0.3'
              minApi = 21
              targetApi = 30
              versionCode = 1
              versionName = 'ci-verification'
          }
          GRADLE
          cat >> settings.gradle <<'GRADLE'

          include ':remoteClientLib:jni:libs:deps:FreeRDP:client:Android:Studio:freeRDPCore'
          project(':remoteClientLib:jni:libs:deps:FreeRDP:client:Android:Studio:freeRDPCore').projectDir =
              new File('remote-desktop-clients/remoteClientLib/jni/libs/deps/FreeRDP/client/Android/Studio/freeRDPCore')
          GRADLE
          echo "Pinned FreeRDP source restored for CI only; no production gitlink modified"
      - name: Verify Android Gradle configuration first
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew :app:help --no-daemon --console=plain 2>&1 | tee gradle-config.log
      - name: Execute AssetDownloader regression tests
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --tests 'tech.ula.utils.AssetDownloaderTest' --no-daemon --console=plain 2>&1 | tee gradle-tests.log
